<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OCRX Flask App</title>
        <style>
            html {
                background-color: #10151b;
                background: url(https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1074&q=80)
                    no-repeat center center fixed;
                -webkit-background-size: cover;
                -moz-background-size: cover;
                -o-background-size: cover;
                background-size: cover;
                user-select: none;
            }

            body {
                font-family: "Prompt", sans-serif;
                -webkit-font-smoothing: antialiased;
                min-height: 100vh;
                position: relative;
                width: 100%;
                overflow: hidden;
            }

            h1 {
                line-height: 0.95;
                color: #ffff;
                font-weight: 900;
                font-size: 4rem;
                text-transform: uppercase;
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                pointer-events: none;
            }

            .center {
                position: relative;
                margin: auto;
                width: 100%;
                height: 100%;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                backdrop-filter: blur(10px);
                min-height: 100vh;
            }

            .btn {
                margin: 0 auto;
                padding: 1rem 2rem;
                border: 2px solid #7e3af2;
                background: #7e3af23d;
                border-radius: 0rem;
                font-size: 1rem;
                line-height: 1rem;
                color: #fff;
                letter-spacing: 0.25em;
                text-decoration: none;
                font-weight: 800;
                text-transform: uppercase;
                vertical-align: middle;
                text-align: center;
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                -webkit-transition: background 0.4s, color 0.4s;
                transition: background 0.4s, color 0.4s;
                cursor: pointer;
            }

            .btn:hover {
                background: #7e3af2;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="center">
            <h1>OCRX SERVER</h1>
            <a class="btn" href="https://ocrx.foorsa.co/" target="_blank">
                Go to OCRX
            </a>
        </div>
    </body>
</html>
